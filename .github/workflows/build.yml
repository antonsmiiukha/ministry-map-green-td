name: Build Mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mod version
        id: meta
        run: |
          version=$(grep -E '^version:' mod.hjson | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact=green-td-v${version}" >> "$GITHUB_OUTPUT"

      - name: Package mod
        run: |
          zip -r "${{ steps.meta.outputs.artifact }}.zip" mod.hjson scripts maps -x "*.DS_Store"
          unzip -l "${{ steps.meta.outputs.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.meta.outputs.artifact }}.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.artifact }}.zip
          generate_release_notes: true
